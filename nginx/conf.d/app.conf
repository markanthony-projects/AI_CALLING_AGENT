server {
    listen 80;
    server_name ai-calls.homebble.in;

    # Certbot writes its challenge file here. Must stay on plain HTTP, and must sit above
    # the redirect or renewal fails.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ai-calls.homebble.in;

    ssl_certificate     /etc/letsencrypt/live/ai-calls.homebble.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai-calls.homebble.in/privkey.pem;

    # Written out here rather than included from /etc/letsencrypt. Certbot's certonly mode
    # does not create options-ssl-nginx.conf, and downloading it from the certbot repo broke
    # when they restructured their paths. Keeping it in the repo makes the config reproducible.
    #
    # No ssl_dhparam: it is only consulted for DHE key exchange, and the cipher list below is
    # ECDHE-only, so the file would never be read. That also removes a slow one-time
    # generation step from first deploy.
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # A dial request carries up to 500 numbers; nothing here is large.
    client_max_body_size 1m;

    # 127.0.0.11 is Docker's embedded DNS. Without this, nginx resolves "api" once at
    # startup and caches the IP — so every `up -d --build` recreates api with a new address
    # and nginx keeps proxying to the dead one until it is restarted. Re-resolving every 10s
    # means a rebuilt api is picked up on its own.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api api:8000;

    # The media stream. Nginx defaults to a 60s read timeout, which would drop a live call
    # mid-sentence, and buffering would add latency to audio that has to arrive in real time.
    location /ws/ {
        proxy_pass http://$api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://$api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
