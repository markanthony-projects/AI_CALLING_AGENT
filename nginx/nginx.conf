user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # $uri instead of the usual $request. $request carries the query string, and the answer
    # and stream URLs put a live call token there — logging it writes a replayable
    # credential to disk. The app's own log filter cannot reach this logger, so the format
    # has to leave the query out. Nothing else on this service uses query parameters.
    log_format safe '$remote_addr - $status "$request_method $uri $server_protocol" '
                    '$body_bytes_sent "$http_user_agent" rt=$request_time';

    access_log /var/log/nginx/access.log safe;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # Only send "Connection: upgrade" when the client actually asked to upgrade; sending it
    # on ordinary requests breaks keepalive.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/conf.d/*.conf;
}
