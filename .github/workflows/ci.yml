name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # The Pipecat contract tests assert against the real installed library, so the full
      # runtime stack is required — a mocked Pipecat would not have caught the dead handlers.
      - run: pip install -r requirements-dev.txt

      - run: pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t callingagent:${{ github.sha }} .
